# ---------------------------------------------------------------------------
# P4LEHORSE on owensfamily.
#
# Add this service to the existing `cloudflared` stack in Portainer, or deploy
# it standalone with the external network declared below. Either way:
#
#   - no host ports, the tunnel reaches it by service name on the shared network
#   - all state in /srv/apps/p4lehorse-data, bind-mounted to /data
#   - config from /srv/apps/p4lehorse/.env, never from this file
#
# Tunnel ingress for the public hostname points at:  http://p4lehorse:3000
# ---------------------------------------------------------------------------

services:
  p4lehorse:
    # Must match `github.repository` in .github/workflows/build.yml, which is the
    # namespace the image is pushed under. When the repo changed owner the
    # workflow followed it and this line did not, so Watchtower polled a tag
    # nothing published to and the site sat on a stale image without erroring.
    image: ghcr.io/jhawkins1313/p4lehorse:latest
    restart: unless-stopped
    env_file:
      - /srv/apps/p4lehorse/.env
    environment:
      # These two are fixed by the image layout, so they live here rather than
      # in .env where someone might change one and not the other.
      DATABASE_URI: file:/data/p4lehorse.db
      MEDIA_DIR: /data/media
    volumes:
      - /srv/apps/p4lehorse-data:/data
    networks:
      - cloudflared_default

networks:
  cloudflared_default:
    external: true
